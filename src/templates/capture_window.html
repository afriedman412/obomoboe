<!doctype html>
<html lang="en"{% if theme.mode != 'auto' %} data-theme="{{ theme.mode }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saving &middot; obomoboe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style id="theme-css">{{ theme.css | safe }}</style>
  <style>
    /* Sized for the 460x200 window the bookmarklet opens. */
    body {
      margin: 0;
      padding: 0 22px 18px;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.45 var(--serif);
    }
    .capture-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 0 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--line-hard);
      box-shadow: 0 2px 0 var(--highlight);
    }
    .capture-brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .capture-state {
      font-family: var(--stencil);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .capture-body { display: flex; gap: 16px; align-items: flex-start; }

    /* The stamp: a ring while it works, a filled seal once it is saved. */
    .capture-stamp {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      display: grid;
      place-items: center;
      font: 700 22px/1 var(--stencil);
      color: var(--on-accent);
      animation: capture-spin .9s linear infinite;
    }
    .is-saved .capture-stamp {
      animation: none;
      border-color: var(--line-hard);
      background: var(--second-deep);
      box-shadow: 2px 2px 0 var(--line-hard);
    }
    .is-saved .capture-stamp::before { content: "\2713"; }
    .is-error .capture-stamp {
      animation: none;
      border-color: var(--danger);
      color: var(--danger);
    }
    .is-error .capture-stamp::before { content: "!"; }
    /* Saved, but only part of the article: amber, and it stays open. */
    .is-warn .capture-stamp {
      animation: none;
      border-color: var(--warn);
      color: var(--warn);
    }
    .is-warn .capture-stamp::before { content: "!"; }
    .is-warn .capture-status { color: var(--warn); }
    .capture-close {
      margin-top: 8px;
      font: 12px var(--stencil);
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1.5px solid var(--line-hard);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }
    .capture-close[hidden] { display: none; }
    @keyframes capture-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .capture-stamp { animation: none; border-color: var(--accent); }
    }

    .capture-text { min-width: 0; }
    .capture-status { font-size: 21px; font-weight: 700; line-height: 1.2; margin: 2px 0 4px; }
    .is-error .capture-status { color: var(--danger); }
    .capture-site {
      font-family: var(--stencil);
      font-size: 11.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--second-deep);
      margin: 0;
    }
    .capture-detail {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 0;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="is-waiting">
  <header class="capture-bar">
    <span class="capture-brand">obomoboe</span>
    <span class="capture-state" id="state">waiting</span>
  </header>
  <div class="capture-body">
    <span class="capture-stamp" aria-hidden="true"></span>
    <div class="capture-text" role="status" aria-live="polite">
      <p class="capture-status" id="status">Waiting for the page&hellip;</p>
      <p class="capture-site" id="site"></p>
      <p class="capture-detail" id="detail"></p>
      <button type="button" class="capture-close" id="close" hidden>close</button>
    </div>
  </div>
  <script>
  // The bookmarklet cannot post to us from the article's page: sites like
  // nytimes.com send a Content-Security-Policy whose connect-src allows only
  // https:, which blocks any fetch to http://127.0.0.1 before it leaves the
  // page. So the bookmarklet opens this window on our own origin and hands
  // the page over with postMessage, which CSP does not govern. From here the
  // POST to /capture is same-origin and nothing stands in its way.
  (function () {
    var status = document.getElementById('status');
    var site = document.getElementById('site');
    var detail = document.getElementById('detail');
    var state = document.getElementById('state');
    var closeButton = document.getElementById('close');
    closeButton.addEventListener('click', function () { window.close(); });
    // phase: waiting, saving, saved, warn or error -- the stamp follows it.
    function show(phase, text, extra, url) {
      document.body.className = 'is-' + phase;
      state.textContent = {waiting: 'waiting', saving: 'saving',
                           saved: 'closing\u2026', warn: 'incomplete',
                           error: 'not saved'}[phase];
      status.textContent = text;
      site.textContent = url ? hostOf(url) : '';
      detail.textContent = extra || '';
      // What needs reading stays up until it's dismissed.
      closeButton.hidden = !(phase === 'warn' || phase === 'error');
    }
    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch (e) { return ''; }
    }
    function closeSoon(ms) { setTimeout(function () { window.close(); }, ms); }

    // Handing the page over is quick; reading it -- and, if it looks cut
    // off, looking for a fuller copy on archive.today -- takes longer. Wait
    // for the answer, so a fragment is reported here and not discovered on
    // the day you sit down to read it.
    function follow(id, url, started) {
      var waited = Date.now() - started;
      if (waited > 6000) show('saving', 'Still working\u2026',
                              'Checking for a fuller copy of the article.', url);
      if (waited > 75000) {
        show('saved', 'Saved', 'Still reading it \u2014 check the list in a moment.', url);
        closeSoon(2500);
        return;
      }
      fetch('{{ url_for("main.api_articles") }}?ids=' + id)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var a = (d.articles || [])[0];
          if (!a || a.archive_status === 'pending') {
            setTimeout(function () { follow(id, url, started); }, 1000);
            return;
          }
          if (a.archive_status === 'failed') {
            show('error', 'Couldn\u2019t read this page', a.archive_error, url);
          } else if (a.incomplete) {
            show('warn', 'Only part of it came through', a.archive_error, url);
          } else if (a.archive_source === 'archive.today') {
            show('saved', 'Saved', 'From archive.today \u2014 the page here was cut off.', url);
            closeSoon(3500);
          } else {
            show('saved', 'Saved', url, url);
            closeSoon(1400);
          }
        })
        .catch(function () { setTimeout(function () { follow(id, url, started); }, 1500); });
    }

    if (!window.opener) {
      show('error', 'Nothing to save here',
           'The bookmarklet opens this window. Click it on the article you want to save.');
      return;
    }
    var received = false;
    window.addEventListener('message', function (event) {
      if (received || event.source !== window.opener) return;
      var data = event.data || {};
      if (data.type !== 'obomoboe-capture') return;
      received = true;
      show('saving', 'Saving\u2026', data.url, data.url);
      fetch('{{ url_for("main.capture") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: data.url, html: data.html})
      }).then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) { show('error', 'Couldn\u2019t save this page', d.error, data.url); return; }
          show('saving', 'Reading the article\u2026', data.url, data.url);
          follow(d.id, data.url, Date.now());
        })
        .catch(function (e) { show('error', 'Couldn\u2019t save this page', String(e), data.url); });
    });
    // The opener has no way to know when this window is listening, so tell it.
    window.opener.postMessage({type: 'obomoboe-ready'}, '*');
  })();
  </script>
</body>
</html>
